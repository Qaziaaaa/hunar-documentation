<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUNAR — Repair Quote</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="frame-full">
  <div class="app-frame">
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <div class="signal-bars">
          <div style="width:3px;height:3px;background:#fff;border-radius:1px"></div>
          <div style="width:3px;height:5px;background:#fff;border-radius:1px"></div>
          <div style="width:3px;height:7px;background:#fff;border-radius:1px"></div>
          <div style="width:3px;height:9px;background:#fff;border-radius:1px;opacity:0.4"></div>
        </div>
        <div style="width:16px;height:9px;border:1px solid rgba(255,255,255,0.6);border-radius:2px;position:relative;margin-left:4px">
          <div style="position:absolute;inset:1px;right:4px;background:#fff;border-radius:1px"></div>
        </div>
      </div>
    </div>

    <!-- Header -->
    <div class="page-header">
      <button class="back-btn" onclick="location.href='inspection.html'"><span id="ic-back" style="width:20px;height:20px;display:inline-flex"></span></button>
      <div class="flex-1">
        <h1>Repair Quotation</h1>
        <p class="sub" id="rq-sub">Awaiting customer approval</p>
      </div>
    </div>

    <div class="screen-body p-4" id="rq-body">
      <!-- Status Card Area -->
      <div id="rq-status-area" class="mb-3"></div>

      <!-- Detected Issues Summary -->
      <div class="card overflow-hidden mb-3">
        <div class="px-4 py-3.5">
          <h3 class="card-title">Detected Issues</h3>
          <div class="flex gap-2 flex-wrap mt-2.5" id="rq-issues"></div>
        </div>
      </div>

      <!-- Itemized Quote Breakdown -->
      <div class="card overflow-hidden mb-4">
        <div class="px-4 pt-3.5 pb-1">
          <h3 class="card-title">Quote Breakdown</h3>
        </div>
        <div class="px-4 py-2" id="quote-items-list"></div>
      </div>

      <!-- Action Button Area -->
      <div id="rq-action-area"></div>
      <div class="h-10"></div>
    </div>

    <div id="toast" class="hidden" style="position:absolute;top:16px;left:16px;right:16px;z-index:50;background:#fff;border-left:3px solid var(--success);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,0.15);padding:12px"></div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    $('#ic-back').innerHTML = ICONS.arrowLeft

    const job = App.Store.get('activeJob', MOCK.ACTIVE_JOB)
    const visitFee = App.Store.get('visitFee', job.visitFee || 285)
    let round = 0
    let approved = false
    let currentAmount = App.Store.get('quoteTotal', 2985)

    const ITEMS = [
      { label: 'PVC Elbow Joint (1-inch)', type: 'Parts', amount: 450 },
      { label: 'Pipe sealant & tape', type: 'Parts', amount: 380 },
      { label: 'Cutting & wall access', type: 'Labor', amount: 600 },
      { label: 'Fitting & sealing', type: 'Labor', amount: 550 },
      { label: 'Re-plastering (minor)', type: 'Labor', amount: 350 },
      { label: 'Visit / Inspection fee', type: 'Visit', amount: visitFee },
    ]

    const TYPE_STYLES = {
      Parts: { bg: '#DBEAFE', text: '#1D4ED8' },
      Labor: { bg: '#EDE9FE', text: '#6D28D9' },
      Visit: { bg: 'var(--primary-light)', text: 'var(--primary)' },
    }

    const issues = App.Store.get('detectedIssues', ['Cracked PVC Pipe', 'Joint Seal Failure'])
    $('#rq-issues').innerHTML = issues
      .map((i) => `<span class="tag" style="background:var(--primary-light);color:#115E59;border:1px solid #99F6E4;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:600">${i}</span>`)
      .join('')

    function renderScreen() {
      const statusArea = $('#rq-status-area')
      const actionArea = $('#rq-action-area')

      // 1. Status Area
      if (approved) {
        statusArea.innerHTML = `
          <div class="p-3.5 rounded-md flex items-center gap-2.5" style="background:var(--primary-light);border:1px solid var(--primary);border-radius:8px">
            <div style="width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <span style="width:12px;height:12px;display:inline-flex">${ICONS.check}</span>
            </div>
            <div>
              <p class="txt-sm fw-600 c-primary">Repair Approved!</p>
              <p class="txt-xs c-navy">Rs. ${App.fmt(currentAmount)} agreed — you may start work.</p>
            </div>
          </div>`
        actionArea.innerHTML = `
          <button class="btn" style="background:var(--primary)" onclick="location.href='active-job.html'">Back to Active Job →</button>`
      } else if (round === 0) {
        statusArea.innerHTML = `
          <div class="p-3.5 rounded-md flex items-center gap-2.5" style="background:var(--surface);border:1px solid var(--border);border-radius:8px">
            <div style="width:8px;height:8px;border-radius:50%;background:var(--warning);animation:pulse 1.5s infinite;flex-shrink:0"></div>
            <p class="txt-xs c-gray">Quote sent to ${job.customerName}. Awaiting response…</p>
          </div>`
        actionArea.innerHTML = `
          <button class="btn btn-outline" style="width:100%;text-align:center" onclick="simulateCounter()">Simulate Customer Counter-Offer (Demo)</button>`
      } else {
        statusArea.innerHTML = `
          <div class="p-4 rounded-md" style="background:var(--navy);border-radius:8px">
            <p class="txt-xs mb-1" style="color:#94A3B8">${job.customerName} countered — Round ${round}/5:</p>
            <p class="txt-xl fw-700 c-white mb-3">Rs. 2,700</p>
            <div class="flex gap-2">
              <button class="btn btn-primary btn-xs flex-1" style="height:36px" onclick="handleApprove(2700)">Accept Rs. 2,700</button>
              <button class="btn btn-outline btn-xs flex-1" style="height:36px;color:#fff;border-color:rgba(255,255,255,0.3)" onclick="counterQuote(2985)">Counter Rs. 2,985</button>
            </div>
          </div>`
        actionArea.innerHTML = ''
      }

      // 2. Breakdown Items
      const comm = Math.round(currentAmount * 0.15)
      const payout = currentAmount - comm

      $('#quote-items-list').innerHTML = `
        ${ITEMS.map((item) => {
          const s = TYPE_STYLES[item.type] || { bg: 'var(--bg)', text: 'var(--gray)' }
          return `
            <div class="flex items-center justify-between py-2" style="border-bottom:1px solid var(--border)">
              <div>
                <p class="txt-xs fw-600 c-navy">${item.label}</p>
                <span class="txt-xs fw-600 px-2 py-0.5" style="background:${s.bg};color:${s.text};border-radius:999px;font-size:9px;text-transform:uppercase;display:inline-block;margin-top:2px">${item.type}</span>
              </div>
              <span class="txt-xs fw-600 c-navy">Rs. ${App.fmt(item.amount)}</span>
            </div>`
        }).join('')}
        <div class="py-2.5" style="border-bottom:1px solid var(--border)">
          <div class="flex justify-between">
            <span class="txt-sm fw-700 c-navy">Total</span>
            <span class="txt-sm fw-700 c-navy">Rs. ${App.fmt(currentAmount)}</span>
          </div>
        </div>
        <div class="py-2">
          <div class="flex justify-between py-1">
            <span class="txt-xs c-gray">Platform Commission (15%)</span>
            <span class="txt-xs c-gray">− Rs. ${App.fmt(comm)}</span>
          </div>
          <div class="flex justify-between py-1">
            <span class="txt-xs fw-700 c-success">Your Payout</span>
            <span class="txt-sm fw-700 c-success">Rs. ${App.fmt(payout)}</span>
          </div>
        </div>
      `
    }

    function simulateCounter() {
      round = 1
      renderScreen()
    }

    function counterQuote(amt) {
      App.showToast('Counter offer of Rs. ' + App.fmt(amt) + ' sent.')
      round++
      renderScreen()
    }

    function handleApprove(amount) {
      currentAmount = amount
      approved = true
      App.Store.set('quoteTotal', amount)
      App.Store.set('jobStatus', 'repair-approved')
      App.showToast('Repair quote approved! You may now begin work.')
      renderScreen()
      setTimeout(() => { location.href = 'active-job.html' }, 1200)
    }

    renderScreen()
  </script>
</body>
</html>
